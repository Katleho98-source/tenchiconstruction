    <h1>Start Your Project With Tenchi Construction</h1>
    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Tenchi Constructions headquarters for general inquiries, project consultations, and department support.">
  <title>Contact Us | Tenchi Constructions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1>Contact Tenchi Constructions</h1>
    <p>Have a question or requirement? Direct your message to the appropriate department below.</p>

    <form id="contactForm" novalidate>
      <!-- Contact Name -->
      <div class="form-group">
        <label for="contactName">Your Name *</label>
        <input type="text" id="contactName" name="name" required placeholder="Jane Smith">
        <span class="error-message" id="contactNameError"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="contactEmail">Email Address *</label>
        <input type="email" id="contactEmail" name="email" required placeholder="jane@example.com">
        <span class="error-message" id="contactEmailError"></span>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="contactPhone">Phone Number *</label>
        <input type="tel" id="contactPhone" name="phone" required placeholder="0831234567">
        <span class="error-message" id="contactPhoneError"></span>
      </div>

      <!-- Department Dropdown -->
      <div class="form-group">
        <label for="department">Target Department *</label>
        <select id="department" name="department" required>
          <option value="">-- Select Department --</option>
          <option value="info@tenchiconstructions.co.za">General Enquiries (Info Desk)</option>
          <option value="projects@tenchiconstructions.co.za">Project Management & Architecture</option>
          <option value="billing@tenchiconstructions.co.za">Accounts & Procurement</option>
        </select>
        <span class="error-message" id="deptError"></span>
      </div>

      <!-- Message Textarea -->
      <div class="form-group">
        <label for="contactMessage">Your Message (Min 20 characters) *</label>
        <textarea id="contactMessage" name="message" rows="6" placeholder="Write your query or message here..."></textarea>
        <span class="error-message" id="contactMsgError"></span>
      </div>

      <button type="submit" class="btn-submit">Send Message via Email</button>
    </form>

    <div id="contactStatus" class="status-msg hidden"></div>
  </main>

  <script src="contact.js"></script>
</body>
